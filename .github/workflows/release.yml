name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify tag matches project version
      shell: bash
      run: |
        project_version="$(./gradlew --no-daemon -q properties | sed -n 's/^version: //p')"
        tag_version="${GITHUB_REF_NAME#v}"
        if [[ -z "${project_version}" || "${tag_version}" != "${project_version}" ]]; then
          echo "Tag version ${tag_version} does not match project version ${project_version}"
          exit 1
        fi

    - name: Build
      run: ./gradlew --no-daemon clean build

    - name: Verify Maven consumer
      shell: bash
      run: |
        local_repository="${RUNNER_TEMP}/panacea-maven"
        ./gradlew --no-daemon -Dmaven.repo.local="${local_repository}" publishToMavenLocal
        ./gradlew --no-daemon -p .github/consumer-smoke \
          -PsdkRepository="${local_repository}" \
          -PsdkVersion="${GITHUB_REF_NAME#v}" \
          clean compileJava

    - name: Publish to GitHub Packages
      run: ./gradlew --no-daemon publish
      env:
        GPR_USER: ${{ github.actor }}
        GPR_API_KEY: ${{ secrets.GITHUB_TOKEN }}
