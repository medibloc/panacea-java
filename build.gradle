plugins {
    id('java-library')
    id('maven-publish')
    id('com.google.protobuf') version '0.9.4'
}

group 'org.medibloc.panacea'
version '2.3.0'

sourceSets {
    main {
        proto {
            srcDir "src/main/resources/proto"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api("org.bitcoinj:bitcoinj-core:0.16.2") {
        exclude group: "com.google.protobuf", module: "protobuf-javalite"
    }
    implementation("org.apache.commons:commons-lang3:3.14.0")
    implementation("org.apache.commons:commons-collections4:4.4")
    implementation("commons-codec:commons-codec:1.16.1")
    implementation("commons-net:commons-net:3.10.0")
    implementation("com.fasterxml.jackson.core:jackson-core:2.16.2")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.16.2")
    compileOnly("org.projectlombok:lombok:1.18.30")
    annotationProcessor("org.projectlombok:lombok:1.18.30")

    implementation("ch.qos.logback:logback-classic:1.2.3")

    api 'io.grpc:grpc-protobuf:1.62.2'
    api 'io.grpc:grpc-stub:1.62.2'
    implementation 'io.grpc:grpc-netty-shaded:1.62.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}

protobuf {
    protoc {
        // The artifact spec for the Protobuf Compiler
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        // Optional: an artifact spec for a protoc plugin, with "grpc" as
        // the identifier, which can be referred to in the "plugins"
        // container of the "generateProtoTasks" closure.
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
    }
    generateProtoTasks {
        ofSourceSet('main').configureEach {
            plugins {
                // Apply the "grpc" plugin whose spec is defined above, without
                // options.  Note the braces cannot be omitted, otherwise the
                // plugin will not be added. This is because of the implicit way
                // NamedDomainObjectContainer binds the methods.
                grpc {}
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

def integrationTestPattern = '**/Grpc*Test.class'

tasks.named('test', Test) {
    exclude integrationTestPattern
}

tasks.register('integrationTest', Test) {
    description = 'Runs tests against the Panacea testnet.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include integrationTestPattern
    shouldRunAfter tasks.named('test')

    doFirst {
        def missingVariables = ['OWNER_MNEMONIC', 'RECIPIENT_MNEMONIC'].findAll {
            !System.getenv(it)
        }
        if (!missingVariables.isEmpty()) {
            throw new GradleException(
                    "Missing environment variables for testnet integration tests: ${missingVariables.join(', ')}")
        }
    }
}

publishing {
    repositories {
        maven {
            url = uri("https://maven.pkg.github.com/medibloc/panacea-java")
            credentials {
                username = System.getenv("GPR_USER")
                password = System.getenv("GPR_API_KEY")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
}
